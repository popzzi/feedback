    <style>
        body { font-family: 'Inter', sans-serif; }
        @media (max-width: 1023px) {
            #main-header { transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out; }
        }

        /* 피드백 모드 활성화 시 커서 및 호버 효과 */
        body.feedback-mode *:not(#feedback-widget-container):not(#feedback-widget-container *) { cursor: crosshair !important; }
        body.feedback-mode *:not(#feedback-widget-container):not(#feedback-widget-container *):hover { outline: 2px dashed #6366f1 !important; outline-offset: 2px; }

        /* 뷰포트 기준 fixed 좌표계 적용된 빨간 별표 피드백 마커 */
        .feedback-star-marker {
            position: absolute;
            z-index: 90;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease;
        }
        .feedback-star-marker:hover {
            transform: translate(-50%, -50%) scale(1.2);
            z-index: 70;
        }

        /* 모달 내부 별표 마커 (더 높은 z-index 부여) */
        .feedback-star-marker-modal {
            z-index: 70;
        }

        /* 별표 마커에 마우스 호버 시 나타나는 상세 툴팁 카드 */
        .feedback-hover-tooltip {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: rgb(15 23 42 / 95%);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            width: max-content;
            max-width: 220px;
            white-space: pre-line;        
            word-break: break-all;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 80;
        }
        .feedback-star-marker:hover .feedback-hover-tooltip {
            opacity: 1;
            visibility: visible;
        }
        
        .feedback-star-marker.tooltip-bottom .feedback-hover-tooltip {
            bottom: auto;
            top: 100%;
            margin-bottom: 0;
            margin-top: 6px;
        }
        .feedback-content-text {
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 피드백 목록 내 특정 항목 포커스 강조 스타일 */
        .feedback-item-highlight {
            border-color: #6366f1 !important;
            background-color: #eef2ff !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }
        @keyframes marker-bounce-highlight {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.6); background-color: #6366f1; }
        }
        .marker-highlight-anim {
            animation: marker-bounce-highlight 0.6s ease-in-out 3;
            z-index: 999 !important;
        }
    </style>

                                                                ${pid} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                            </a>
                                                        </td>
                                                        <td onclick="switchPage('edit')" class="py-3 px-4 whitespace-nowrap cursor-pointer"><span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-xs">${type}</span></td>
                                                        <td onclick="switchPage('edit')" class="py-3 px-4 whitespace-nowrap cursor-pointer"><div class="w-10 h-10 rounded-lg bg-slate-200 flex items-center justify-center"><i class="fa-regular fa-image text-slate-400"></i></div></td>
                                                        <td onclick="switchPage('edit')" class="py-3 px-4 font-medium text-slate-900 whitespace-nowrap cursor-pointer hover:text-indigo-600">${titles[j-1]}</td>
                                                        <td class="py-3 px-4 text-center whitespace-nowrap" onclick="event.stopPropagation()"><input type="checkbox" ${isRecommended ? 'checked' : ''} class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer"></td>
                                                        <td class="py-3 px-4 text-center whitespace-nowrap" onclick="event.stopPropagation()">
                                                            <button onclick="togglePcVisibility(this)" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200 inline-flex items-center gap-1.5 text-xs font-medium">
                                                                <span class="w-2.5 h-2.5 rounded-full ${isVisible ? 'bg-emerald-500' : 'bg-slate-300'} inline-block"></span>
                                                                <span>${isVisible ? '노출중' : '숨김'}</span>
                                                            </button>
                                                        </td>
                                                        <td class="py-3 px-4 text-center whitespace-nowrap" onclick="event.stopPropagation()">
                                                            <button onclick="togglePcSelling(this)" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200 inline-flex items-center gap-1.5 text-xs font-medium">
                                                                <span class="w-2.5 h-2.5 rounded-full ${isSelling ? 'bg-indigo-500' : 'bg-rose-500'} inline-block"></span>
                                                                <span>${isSelling ? '판매중' : '품절'}</span>
                                                            </button>
                                                        </td>
                                                        <td onclick="switchPage('edit')" class="py-3 px-4 text-xs text-slate-500 whitespace-nowrap cursor-pointer">2026.05.01 ~ 2026.12.31</td>
                                                    </tr>
                                                `);
                                            }
                                        </script>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>

                <!-- 📌 [페이지 3] 상품 상세 수정 뷰 -->
                <main id="page-edit" class="flex-1 overflow-hidden hidden bg-slate-100">
                    <iframe src="detail.html" class="w-full h-full border-0"></iframe>
                </main>
            </div>
        </div>

        <!-- [하단 고정 바 영역] -->
        <footer id="feedback-widget-container" class="h-16 bg-slate-900 text-white px-6 flex items-center justify-between flex-shrink-0 z-50 border-t border-slate-800 shadow-lg">
            <div id="feedback-list-backdrop" onclick="toggleFeedbackList()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-[1px] z-40 hidden"></div>
            <div class="flex items-center gap-2 text-xs font-medium">
                <i class="fa-solid fa-comments text-indigo-400 text-sm"></i>
                <span class="text-slate-300">UI 피드백 도구</span>
            </div>
            <div class="flex items-center gap-3 relative">
                <!-- 피드백 목록 팝업 패널 -->
                <div id="feedback-list-panel" class="absolute bottom-14 right-0 w-[700px] bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 hidden flex-col max-h-[60vh] text-xs z-50 space-y-3 text-slate-800">
                    <div class="flex items-center justify-between font-bold text-slate-900 border-b pb-2 flex-shrink-0">
                        <span class="text-indigo-600">등록된 피드백 목록 (<span id="feedback-count">0</span>)</span>
                        <div class="flex items-center gap-2">
                            <button onclick="exportFeedbacksJson()" title="JSON 파일 내보내기" class="text-emerald-600 hover:text-emerald-700"><i class="fa-solid fa-file-arrow-down text-sm"></i></button>
                            <label title="JSON 파일 불러오기" class="text-indigo-600 hover:text-indigo-700 cursor-pointer">
                                <i class="fa-solid fa-file-arrow-up text-sm"></i>
                                <input type="file" accept=".json" onchange="importFeedbacksJson(event)" class="hidden">
                            </label>
                            <button onclick="toggleFeedbackList()"><i class="fa-solid fa-xmark text-sm"></i></button>
                        </div>
                    </div>
                    <div id="feedback-items-container" class="h-[50vh] overflow-y-auto space-y-2.5 flex-1 pr-1"></div>
                </div>

                <button id="feedback-view-btn" onclick="toggleFeedbackViewMode()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl shadow-sm font-bold text-xs flex items-center gap-1.5 transition-all" title="현재 화면에 피드백 빨간 별표 표시">
                    <i class="fa-solid fa-eye"></i> <span>피드백 보기</span>
                </button>

                <button id="feedback-mode-btn" onclick="toggleFeedbackMode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl shadow-sm font-bold text-xs flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-highlighter text-indigo-400"></i> <span id="mode-btn-text">요소별 메모 모드 켜기</span>
                </button>

                <button onclick="toggleFeedbackList()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-9 h-9 rounded-xl shadow-sm flex items-center justify-center relative transition-all" title="피드백 목록 보기">
                    <i class="fa-solid fa-list-check text-xs"></i>
                    <span id="feedback-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden font-bold">0</span>
                </button>
            </div>
        </footer>

    </div>

    <!-- 메모 작성 모달 -->
    <div id="feedback-input-modal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5 space-y-3 text-xs">
            <div class="flex items-center justify-between font-bold text-slate-900 border-b pb-2">
                <span class="text-indigo-600"><i class="fa-solid fa-map-pin mr-1"></i> 선택한 요소에 피드백 남기기</span>
                <button onclick="closeFeedbackInputModal()"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <div id="selected-target-desc" class="p-2 bg-slate-100 rounded-lg text-slate-700 font-mono text-[11px] truncate"></div>
            <textarea id="element-feedback-text" rows="4" class="w-full p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="수정 요청 사항을 입력하세요..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeFeedbackInputModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-semibold">취소</button>
                <button id="save-feedback-btn" onclick="saveElementFeedback()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold shadow-sm flex items-center gap-1.5">
                    <span>저장하기</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let detailModalEl;
        let globalFeedbacks = [];
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2AekPgOWVIue7LZrRUVmne0K7snoX13ZfczUDVfY9ipTsMyhkQtQgZAU_WmJEoHbF/exec";

        window.addEventListener('DOMContentLoaded', () => {
            switchPage('reservation');
            loadFeedbacks();

            const myIframe = document.getElementById('iframe_reservation');
            myIframe.addEventListener('load', () => {
                const iframeDoc = myIframe.contentDocument || myIframe.contentWindow.document;
                detailModalEl = iframeDoc.getElementById('detail-modal');
            });
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const sidebarTexts = document.querySelectorAll('.sidebar-text');
            
            if (window.innerWidth < 1024) {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            } else {
                if (sidebar.classList.contains('w-64')) {
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-16');
                    sidebarTexts.forEach(el => el.classList.add('hidden'));
                } else {
                    sidebar.classList.remove('w-16');
                    sidebar.classList.add('w-64');
                    setTimeout(() => {
                        sidebarTexts.forEach(el => el.classList.remove('hidden'));
                    }, 150);
                }
            }
        }

        function toggleSubmenu(id) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('w-16')) return;
            const submenu = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            submenu.classList.toggle('hidden');
            if(icon) icon.classList.toggle('rotate-180');
        }

        function switchPage(pageType) {
            const pageRes = document.getElementById('page-reservation');
            const pageProd = document.getElementById('page-product');
            const pageEdit = document.getElementById('page-edit');
            const navRes = document.getElementById('nav-reservation');
            const navProd = document.getElementById('nav-product');

            pageRes.classList.add('hidden');
            pageProd.classList.add('hidden');
            pageEdit.classList.add('hidden');

            if (pageType === 'reservation') {
                pageRes.classList.remove('hidden');
                navRes.className = "flex items-center px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium text-xs transition-colors whitespace-nowrap";
                if(navProd) navProd.className = "flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 text-xs transition-colors whitespace-nowrap";
            } else if (pageType === 'product') {
                pageProd.classList.remove('hidden');
                if(navProd) navProd.className = "flex items-center px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium text-xs transition-colors whitespace-nowrap";
                navRes.className = "flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 text-xs transition-colors whitespace-nowrap";
            } else if (pageType === 'edit') {
                pageEdit.classList.remove('hidden');
            }

            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }

            syncFeedbackModeToIframes();
            
            if (isFeedbackViewMode) {
                isFeedbackViewMode = false;
                toggleFeedbackViewMode();
                renderParentStarMarkers();
            }
        }

        function togglePcVisibility(btn) {
            const dot = btn.querySelector('span:first-child');
            const textSpan = btn.querySelector('span:last-child');
            if (textSpan.innerText === '노출중') {
                textSpan.innerText = '숨김';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-300 inline-block';
            } else {
                textSpan.innerText = '노출중';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block';
            }
        }

        function togglePcSelling(btn) {
            const dot = btn.querySelector('span:first-child');
            const textSpan = btn.querySelector('span:last-child');
            if (textSpan.innerText === '판매중') {
                textSpan.innerText = '품절';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 inline-block';
            } else {
                textSpan.innerText = '판매중';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block';
            }
        }

        function toggleMobileVisibility(btn) {
            if (btn.innerText.trim() === '노출중') {
                btn.innerText = '숨김';
                btn.className = 'px-2.5 py-0.5 text-xs font-medium bg-slate-100 text-slate-600 rounded-full transition-colors';
            } else {
                btn.innerText = '노출중';
                btn.className = 'px-2.5 py-0.5 text-xs font-medium bg-emerald-100 text-emerald-800 rounded-full transition-colors';
            }
        }

        function toggleMobileSelling(btn) {
            if (btn.innerText.trim() === '판매중') {
                btn.innerText = '품절';
                btn.className = 'px-2.5 py-0.5 text-xs font-medium bg-rose-100 text-rose-800 rounded-full transition-colors';
            } else {
                btn.innerText = '판매중';
                btn.className = 'px-2.5 py-0.5 text-xs font-medium bg-indigo-100 text-indigo-800 rounded-full transition-colors';
            }
        }

        let isFeedbackMode = false;
        let isFeedbackViewMode = false;
        let pendingTarget = null;

        function syncFeedbackModeToIframes() {
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    iframe.contentWindow.postMessage({ feedbackMode: isFeedbackMode }, '*');
                } catch(e) {}
            });
        }

        function toggleFeedbackMode() {
            isFeedbackMode = !isFeedbackMode;
            if (isFeedbackMode && isFeedbackViewMode) toggleFeedbackViewMode();

            const btn = document.getElementById('feedback-mode-btn');
            const btnText = document.getElementById('mode-btn-text');
            
            if (isFeedbackMode) {
                document.body.classList.add('feedback-mode');
                if(btn) btn.className = "bg-indigo-600 text-white border border-indigo-600 px-3.5 py-2 rounded-xl shadow-sm font-bold text-xs flex items-center gap-1.5 transition-all";
                if(btnText) btnText.innerText = "메모 모드 켜짐 (요소를 클릭하세요)";
            } else {
                document.body.classList.remove('feedback-mode');
                if(btn) btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl shadow-sm font-bold text-xs flex items-center gap-1.5 transition-all";
                if(btnText) btnText.innerText = "요소별 메모 모드 켜기";
            }
            syncFeedbackModeToIframes();
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'FOCUS_FEEDBACK_ITEM') {
                focusFeedbackItem(event.data.feedbackId);
            }
            if (event.data && event.data.type === 'MODAL_STATE_CHANGED') {
                if (isFeedbackViewMode) {
                    renderParentStarMarkers();
                }
            }
            if (event.data && event.data.type === 'MODAL_TAB_CHANGED') {
                if (isFeedbackViewMode) {
                    renderParentStarMarkers();
                }
            }
            if (event.data && event.data.type === 'IFRAME_ELEMENT_CLICKED') {
                const data = event.data;
                pendingTarget = {
                    tagName: data.tagName,
                    innerText: data.previewText,
                    selector: data.selector,
                    isModal: data.isModal || false
                };

                const identifier = `[iframe > ${data.tagName}] "${data.previewText}..."`;
                document.getElementById('selected-target-desc').innerText = identifier;
                document.getElementById('element-feedback-text').value = '';
                document.getElementById('feedback-input-modal').classList.remove('hidden');
                document.getElementById('element-feedback-text').focus();

                isFeedbackMode = false;
                document.body.classList.remove('feedback-mode');
                document.getElementById('feedback-mode-btn').className = "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl shadow-sm font-bold text-xs flex items-center gap-1.5 transition-all";
                document.getElementById('mode-btn-text').innerText = "요소별 메모 모드 켜기";
                syncFeedbackModeToIframes();
            }
        });

        document.addEventListener('click', function(e) {
            if (!isFeedbackMode) return;
            if (e.target.closest('#feedback-widget-container') || e.target.closest('#feedback-input-modal')) return;

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            pendingTarget = e.target;
            const tagName = pendingTarget.tagName.toLowerCase();
            const identifier = pendingTarget.innerText ? `[${tagName}] "${pendingTarget.innerText.substring(0, 20)}..."` : `<${tagName}>`;
            
            document.getElementById('selected-target-desc').innerText = identifier;
            document.getElementById('element-feedback-text').value = '';
            document.getElementById('feedback-input-modal').classList.remove('hidden');
            document.getElementById('element-feedback-text').focus();

            toggleFeedbackMode();
        }, true);

        function closeFeedbackInputModal() {
            document.getElementById('feedback-input-modal').classList.add('hidden');
            pendingTarget = null;
        }

        function getCssSelector(el) {
            if (!el || el === document.body) return 'body';
            let path = [];
            while (el && el.nodeType === Node.ELEMENT_NODE) {
                let selector = el.tagName.toLowerCase();
                if (el.id) {
                    selector += '#' + el.id;
                    path.unshift(selector);
                    break;
                } else {
                    let sib = el, nth = 1;
                    while ((sib = sib.previousElementSibling)) {
                        if (sib.tagName.toLowerCase() === selector) nth++;
                    }
                    if (nth > 1) selector += `:nth-of-type(${nth})`;
                }
                path.unshift(selector);
                el = el.parentElement;
            }
            return path.join(' > ');
        }

        async function saveElementFeedback() {
            const text = document.getElementById('element-feedback-text').value.trim();
            if (!text) { alert('메모 내용을 입력해주세요.'); return; }

            const saveBtn = document.getElementById('save-feedback-btn');
            const originalBtnHtml = saveBtn.innerHTML;
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> 저장 중...`;

            const selectorPath = pendingTarget.selector ? pendingTarget.selector : getCssSelector(pendingTarget);
            let activePage = 'reservation.html';
            if (!document.getElementById('page-product').classList.contains('hidden')) activePage = 'product.html';
            if (!document.getElementById('page-edit').classList.contains('hidden')) activePage = 'detail.html';
            
            const isModalOpen = detailModalEl ? !detailModalEl.classList.contains('hidden') : false;

            const newFeedback = {
                id: Number(Date.now()),
                pageUrl: activePage,
                content: text,
                tagName: pendingTarget ? pendingTarget.tagName.toLowerCase() : 'element',
                previewText: pendingTarget ? (pendingTarget.innerText ? pendingTarget.innerText.substring(0, 15) : '영역') : '',
                selector: selectorPath,
                isModal: Boolean(isModalOpen || pendingTarget.isModal || false),
                date: new Date().toLocaleTimeString(),
                completed: false,
                comments: []
            };

            globalFeedbacks.push(newFeedback);
            renderFeedbackItemsOnly();
            if (isFeedbackViewMode) renderParentStarMarkers();

            try {
                await syncAndSaveToSheet();
                closeFeedbackInputModal();
                alert('피드백이 성공적으로 저장되었습니다!');
            } catch (err) {
                console.error(err);
                alert('저장 중 오류가 발생했습니다.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnHtml;
            }
        }

        function toggleFeedbackViewMode() {
            isFeedbackViewMode = !isFeedbackViewMode;
            const viewBtn = document.getElementById('feedback-view-btn');

            document.querySelectorAll('.feedback-star-marker').forEach(el => el.remove());

            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc) {
                        iframeDoc.querySelectorAll('.feedback-star-marker').forEach(el => el.remove());
                    }
                } catch(e) {}
            });

            if (isFeedbackViewMode) {
                if(viewBtn) viewBtn.classList.add('bg-indigo-700', 'ring-2', 'ring-indigo-300', 'shadow-inner');
                renderParentStarMarkers();

                const isDetailModalOpen = detailModalEl ? !detailModalEl.classList.contains('hidden') : false;
                document.querySelectorAll('iframe').forEach(iframe => {
                    try {
                        iframe.contentWindow.postMessage({ type: 'SHOW_STAR_MARKERS', show: true, isModalOpen: isDetailModalOpen }, '*');
                    } catch(e) {}
                });
            } else {
                if(viewBtn) viewBtn.classList.remove('bg-indigo-700', 'ring-2', 'ring-indigo-300', 'shadow-inner');
                document.querySelectorAll('iframe').forEach(iframe => {
                    try {
                        iframe.contentWindow.postMessage({ type: 'SHOW_STAR_MARKERS', show: false }, '*');
                    } catch(e) {}
                });
            }
        }

        function renderParentStarMarkers() {
            document.querySelectorAll('.feedback-star-marker').forEach(el => el.remove());
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc) {
                        iframeDoc.querySelectorAll('.feedback-star-marker').forEach(el => el.remove());
                    }
                } catch(e) {}
            });

            let activePage = 'reservation.html';
            if (!document.getElementById('page-product').classList.contains('hidden')) {
                activePage = 'product.html';
            } else if (!document.getElementById('page-edit').classList.contains('hidden')) {
                activePage = 'detail.html';
            }

            globalFeedbacks.filter(item => item.pageUrl === activePage && !item.completed).forEach(item => {
                if (!item.selector) return;

                try {
                    let targetEl = null;
                    targetEl = document.querySelector(item.selector);

                    if (!targetEl) {
                        const iframes = document.querySelectorAll('iframe');
                        for (const iframe of iframes) {
                            try {
                                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                                if (iframeDoc) {
                                    targetEl = iframeDoc.querySelector(item.selector);
                                    if (targetEl) break;
                                }
                            } catch (err) {}
                        }
                    }

                    if (targetEl) {
                        const rect = targetEl.getBoundingClientRect();
                        if (rect.width > 0 && rect.height > 0) {
                            const ownerDoc = targetEl.ownerDocument;
                            const marker = ownerDoc.createElement('div');
                            
                            const isNearTop = rect.top < 80;
                            marker.className = (item.isModal ? 'feedback-star-marker feedback-star-marker-modal' : 'feedback-star-marker') + (isNearTop ? ' tooltip-bottom' : '');
                            
                            // 마커에 data-id 속성 부여 (목록 클릭 시 정확히 찾기 위함)
                            marker.setAttribute('data-id', item.id);

                            marker.innerHTML = `<i class="fa-solid fa-star text-[10px]"></i><div class="feedback-hover-tooltip">${item.content}</div>`;

                            marker.style.top = (rect.top + ownerDoc.defaultView.pageYOffset + (rect.height / 2)) + 'px';
                            marker.style.left = (rect.left + ownerDoc.defaultView.pageXOffset + (rect.width / 2)) + 'px';

                            marker.addEventListener('click', (e) => {
                                e.stopPropagation();
                                focusFeedbackItem(item.id);
                            });

                            ownerDoc.body.appendChild(marker); 
                        }
                    }
                } catch(e) {}
            });
        }

        function focusFeedbackItem(feedbackId) {
            const panel = document.getElementById('feedback-list-panel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                renderFeedbackItemsOnly();
            }

            setTimeout(() => {
                const targetCard = document.getElementById(`feedback-card-${feedbackId}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetCard.classList.add('feedback-item-highlight');
                    setTimeout(() => {
                        targetCard.classList.remove('feedback-item-highlight');
                    }, 2000);
                }
            }, 100);
        }

        async function loadFeedbacks() {
            const container = document.getElementById('feedback-items-container');
            if(container) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 시트에서 데이터를 불러오는 중...</div>`;
            }

            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    globalFeedbacks = data;
                } else if (data && Array.isArray(data.feedbacks)) {
                    globalFeedbacks = data.feedbacks;
                } else {
                    globalFeedbacks = [];
                }
            } catch (err) {
                console.error('피드백 데이터 로드 실패:', err);
                globalFeedbacks = [];
            }

            renderFeedbackItemsOnly();
        }

        function renderFeedbackItemsOnly() {
            const container = document.getElementById('feedback-items-container');
            const badge = document.getElementById('feedback-badge');
            const countSpan = document.getElementById('feedback-count');
            if(!container) return;
            
            let feedbacks = globalFeedbacks;

            feedbacks = feedbacks.map(item => {
                let parsedComments = [];
                try {
                    let val = item.comments;

                    if (Array.isArray(val)) {
                        parsedComments = val;
                    } else if (typeof val === 'string' && val.trim() !== '') {
                        let raw = val.trim();

                        if (raw.startsWith('"') && raw.endsWith('"')) {
                            raw = raw.slice(1, -1);
                        }
                        
                        raw = raw.replace(/\\"/g, '"').replace(/\\\\/g, '\\');

                        let parsed = JSON.parse(raw);

                        if (typeof parsed === 'string') {
                            parsed = JSON.parse(parsed);
                        }

                        if (Array.isArray(parsed)) {
                            parsedComments = parsed;
                        }
                    }
                } catch (e) {
                    console.error(`ID ${item.id} comments 정제/파싱 에러:`, e);
                    parsedComments = [];
                }

                if (!Array.isArray(parsedComments)) {
                    parsedComments = [];
                }

                return { ...item, comments: parsedComments };
            });

            if(countSpan) countSpan.innerText = feedbacks.length;

            const incompleteCount = feedbacks.filter(item => !item.completed).length;
            if (incompleteCount > 0) {
                if(badge) { 
                    badge.classList.remove('hidden'); 
                    badge.innerText = incompleteCount; 
                }
            } else {
                if(badge) badge.classList.add('hidden');
            }

            container.innerHTML = '';
            if (feedbacks.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">등록된 피드백이 없습니다.<br>메모 모드를 켜고 요소를 클릭해보세요!</div>`;
                return;
            }

            feedbacks.forEach((item, index) => {
                let commentsHtml = (item.comments || []).map((c, cIdx) => `
                    <div class="bg-white p-1.5 rounded border border-slate-200 text-[11px] flex justify-between items-start">
                        <div><strong class="text-indigo-600">${c.author || '운영자'}:</strong> ${c.text}</div>
                        <button onclick="deleteComment(${item.id}, ${cIdx})" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `).join('');

                // 피드백 카드에 cursor-pointer 및 hover 효과 추가
                container.innerHTML += `
                    <div id="feedback-card-${item.id}" data-id="${item.id}" class="feedback-card-item p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 transition-all cursor-pointer hover:border-indigo-400">
                        <div class="flex items-center justify-between font-bold text-slate-900 text-[11px]">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})" class="rounded text-indigo-600">
                                <span class="${item.completed ? 'line-through text-slate-400' : 'text-indigo-600'}">#${index + 1} (${item.pageUrl})</span>
                            </label>
                            <button onclick="deleteFeedback(${item.id})" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                        </div>
                        <p class="text-slate-700 text-sm font-medium feedback-content-text ${item.completed ? 'line-through text-slate-400' : ''}">"${item.content}"</p>
                        <div class="space-y-1 pt-1 border-t border-slate-200">
                            ${commentsHtml}
                            <div class="flex gap-1 pt-1">
                                <input type="text" id="comment-input-${item.id}" placeholder="댓글 남기기..." class="flex-1 px-2 py-1 text-[11px] border border-slate-300 rounded bg-white">
                                <button onclick="addComment(${item.id})" class="px-2 py-1 bg-slate-800 text-white rounded text-[10px]">등록</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function toggleComplete(id) {
            globalFeedbacks = globalFeedbacks.map(f => f.id === id ? { ...f, completed: !f.completed } : f);
            renderFeedbackItemsOnly();
            if (isFeedbackViewMode) renderParentStarMarkers();
            await syncAndSaveToSheet();
        }

        async function addComment(id) {
            const input = document.getElementById(`comment-input-${id}`);
            const text = input.value.trim();
            if(!text) return;
            
            globalFeedbacks = globalFeedbacks.map(f => f.id === id ? { ...f, comments: [...(f.comments || []), { author: '개발/운영자', text, date: new Date().toLocaleTimeString() }] } : f);
            renderFeedbackItemsOnly();
            await syncAndSaveToSheet();
        }

        async function deleteComment(id, cIdx) {
            globalFeedbacks = globalFeedbacks.map(f => f.id === id ? { ...f, comments: f.comments.filter((_, idx) => idx !== cIdx) } : f);
            renderFeedbackItemsOnly();
            await syncAndSaveToSheet();
        }

        function toggleFeedbackList() {
            const panel = document.getElementById('feedback-list-panel');
            const backdrop = document.getElementById('feedback-list-backdrop');
            
            if(panel) {
                panel.classList.toggle('hidden');
                if(backdrop) backdrop.classList.toggle('hidden'); 

                if(!panel.classList.contains('hidden')) {
                    renderFeedbackItemsOnly();
                }
            }
        }

        async function deleteFeedback(id) {
            if (!confirm('정말 이 피드백을 삭제하시겠습니까?')) return;

            globalFeedbacks = globalFeedbacks.filter(item => item.id !== id);
            renderFeedbackItemsOnly();
            
            if (isFeedbackViewMode) {
                renderParentStarMarkers();
            }

            await syncAndSaveToSheet();
        }

        function exportFeedbacksJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalFeedbacks || []));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ssoluck_feedbacks.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importFeedbacksJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    globalFeedbacks = Array.isArray(imported) ? imported : [];
                    renderFeedbackItemsOnly();
                    if (isFeedbackViewMode) renderParentStarMarkers();
                    await syncAndSaveToSheet();
                    alert('피드백 데이터를 성공적으로 불러왔습니다!');
                } catch(err) {
                    alert('유효한 JSON 파일이 아닙니다.');
                }
            };
            reader.readAsText(file);
        }

        async function syncAndSaveToSheet() {
            try {
                const payload = globalFeedbacks.map(f => ({
                    ...f,
                    comments: JSON.stringify(f.comments || [])
                }));

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function focusMarkerOnPage(feedbackId) {
            const targetFeedback = globalFeedbacks.find(f => f.id === feedbackId);
            if (!targetFeedback) return;

            let targetPageType = 'reservation';
            if (targetFeedback.pageUrl.includes('product')) targetPageType = 'product';
            else if (targetFeedback.pageUrl.includes('detail')) targetPageType = 'edit';

            if (targetPageType === 'reservation') switchPage('reservation');
            else if (targetPageType === 'product') switchPage('product');
            else if (targetPageType === 'edit') switchPage('edit');

            if (!isFeedbackViewMode) {
                toggleFeedbackViewMode();
            }

            setTimeout(() => {
                renderParentStarMarkers();

                // 1. 먼저 메인 문서에 마커가 있는지 확인
                let targetMarker = document.querySelector(`.feedback-star-marker[data-id="${targetFeedback.id}"]`);
                
                if (targetMarker) {
                    // 메인 문서에 있는 마커일 경우
                    targetMarker.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetMarker.classList.remove('marker-highlight-anim');
                    void targetMarker.offsetWidth;
                    targetMarker.classList.add('marker-highlight-anim');
                    setTimeout(() => {
                        targetMarker.classList.remove('marker-highlight-anim');
                    }, 2000);
                } else {
                    // 2. 메인에 없다면 iframe 내부로 포커스 명령 전송
                    document.querySelectorAll('iframe').forEach(iframe => {
                        try {
                            iframe.contentWindow.postMessage({ type: 'FOCUS_IFRAME_MARKER', feedbackId: targetFeedback.id }, '*');
                        } catch(e) {}
                    });
                }
            }, 300);
        }

        // 피드백 카드 클릭 이벤트 위임 리스너
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.feedback-card-item');
            if (card) {
                if (e.target.closest('input') || e.target.closest('button') || e.target.closest('label')) {
                    return;
                }
                
                const feedbackId = Number(card.getAttribute('data-id'));
                if (feedbackId) {
                    focusMarkerOnPage(feedbackId);
                }
            }
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFeedbackInputModal();
                if(isFeedbackMode) toggleFeedbackMode();
                if(isFeedbackViewMode) toggleFeedbackViewMode();
            }
        });
    </script>
</body>
</html>
